<title>Hidden Attack Explainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a slim tab bar over one full-height frame that shows the selected page. Tokens match the three pages. */
:root {
  --bg: #f4f5f7; --surface: #fcfcfd; --ink: #14161b; --ink-2: #484d59; --muted: #747a87; --line: #d3d6dd; --focus: #2a78d6;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111216; --surface: #191a1f; --ink: #eceef2; --ink-2: #b6bac4; --muted: #868b97; --line: #393c45; --focus: #3987e5; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111216; --surface: #191a1f; --ink: #eceef2; --ink-2: #b6bac4; --muted: #868b97; --line: #393c45; --focus: #3987e5; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); margin: 0; display: flex; flex-direction: column; }
.bar { flex: none; display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--surface);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.name { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { font: inherit; font-size: 13.5px; color: var(--ink-2); background: transparent; border: 1px solid transparent; border-radius: 6px;
  padding: 5px 11px; cursor: pointer; }
.tab:hover { color: var(--ink); border-color: var(--line); }
.tab[aria-selected="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tab small { font-size: 11.5px; opacity: 0.75; margin-left: 4px; }
iframe { flex: 1; width: 100%; min-height: 0; border: 0; display: block; background: var(--bg); }
</style>

<div class="bar">
  <p class="name">Explaining a hidden attack</p>
  <div class="tabs" role="tablist" aria-label="Pages">
    <button class="tab" role="tab" type="button" id="tab-unconstrained" data-view="unconstrained" data-src="pareto_unconstrained.html">Any instruction <small>19 runs</small></button>
    <button class="tab" role="tab" type="button" id="tab-single-goal" data-view="single-goal" data-src="pareto_single_objective.html">Single-goal instructions <small>19 runs</small></button>
    <button class="tab" role="tab" type="button" id="tab-repeated-runs" data-view="repeated-runs" data-src="pareto_resampled.html">Repeated runs <small>2 per pair</small></button>
    <button class="tab" role="tab" type="button" id="tab-repeated-runs-4" data-view="repeated-runs-4" data-src="pareto_resampled4.html">Repeated runs + harnesses <small>4 per pair</small></button>
    <button class="tab" role="tab" type="button" id="tab-open-attacker" data-view="open-attacker" data-src="pareto_glm.html">Openly malicious agent <small>GLM</small></button>
  </div>
</div>
<iframe id="view" title="Selected page"></iframe>

<script>
(function () {
  "use strict";
  const frame = document.getElementById("view");
  const tabs = Array.from(document.querySelectorAll(".tab"));
  const views = tabs.map(t => t.dataset.view);
  // Pass the viewer's explicit light/dark choice into the frame (system choice works there on its own).
  function syncTheme() {
    try {
      const d = frame.contentDocument && frame.contentDocument.documentElement;
      if (!d) return;
      const t = document.documentElement.getAttribute("data-theme");
      if (t) d.setAttribute("data-theme", t); else d.removeAttribute("data-theme");
    } catch (e) { /* frame not readable: it falls back to the system theme */ }
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  frame.addEventListener("load", syncTheme);
  function show(view) {
    if (!views.includes(view)) view = views[0];
    tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.view === view ? "true" : "false"));
    const tab = tabs.find(t => t.dataset.view === view);
    if (frame.getAttribute("src") !== tab.dataset.src) frame.setAttribute("src", tab.dataset.src);
    frame.title = tab.textContent.trim();
  }
  tabs.forEach(t => t.addEventListener("click", () => {
    if (location.hash.slice(1) === t.dataset.view) show(t.dataset.view); else location.hash = t.dataset.view;
  }));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
